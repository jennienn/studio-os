spring:
  application:
    name: studio-saas
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 3s
      timeout: 3s
  session:
    timeout: 12h
    redis:
      namespace: studio:operator:sessions
      repository-type: indexed
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
app:
  auth:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    verification-ttl: 24h
    reset-ttl: 30m
    rate-limit-per-minute: 30
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.orm.jdbc.bind: "OFF"
    # Constraint violation DETAIL can contain customer names/phone numbers.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
